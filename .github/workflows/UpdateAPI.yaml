---
name: Update API
on:
  pull_request:
    paths:
      - ".github/workflows/UpdateAPI.yaml"
  schedule:
    - cron: "0 6 * * *"  # Daily at 6 a.m. UTC
  workflow_dispatch:

jobs:
  update:
    name: AWS API Definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      - name: Install JuliaFormatter
        shell: julia --project=@format --color=yes {0}
        run: |
          using Pkg
          Pkg.add(PackageSpec(; name="JuliaFormatter", version="1"))
      - name: Instantiate code generator
        shell: julia --project=gen --color=yes {0}
        run: |
          using Pkg
          Pkg.instantiate()
      - name: Update API
        shell: julia --threads=auto --project=gen {0}
        run: |
          using APIGeneration
          APIGeneration.parse_aws_metadata()
        env:
          GITHUB_AUTH: ${{ secrets.GITHUB_TOKEN }}
      - name: Format code
        shell: julia --project=@format --color=yes {0}
        run: |
          using JuliaFormatter
          format("."; verbose=true)
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        if: ${{ github.event_name != 'pull_request' }}
        with:
          commit-message: AWS API Definitions Updated
          reviewers: mattBrzezinski
          title: AWS API Definitions Updated
          token: ${{ secrets.GITHUB_TOKEN }}
